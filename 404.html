<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable - Panoptic</title>
<style>
  :root{--ink:#eaf0ec;--dim:#93a89d;--acc:#3ee89e;--bg:#0f1a16}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
  main{max-width:44ch;text-align:center}
  .code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.18em;color:var(--acc);margin-bottom:18px}
  h1{font-size:30px;letter-spacing:-.02em;line-height:1.15;margin-bottom:12px}
  p{color:var(--dim);margin-bottom:26px}
  a{display:inline-block;background:var(--acc);color:#08120e;text-decoration:none;font-weight:600;
    padding:11px 22px;border-radius:100px}
  a:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main>
  <div class="code">ERREUR 404</div>
  <h1>Cette page n'existe pas.</h1>
  <p>Le lien est peut-etre perime, ou l'adresse comporte une faute.</p>
  <a href="/">Retour a l'accueil</a>
</main>
</body>
</html>
